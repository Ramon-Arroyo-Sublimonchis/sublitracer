[package]
name = "tracer-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Motor de vectorización de Sublitracer (visioncortex → WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
visioncortex = "0.8.10"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
